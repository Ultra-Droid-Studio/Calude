plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nexus.vr'
    compileSdk 34
    defaultConfig {
        applicationId "com.nexus.vr"
        minSdk 24
        targetSdk 34
        versionCode 12
        versionName "1.11"
        // Stage 44: MediaPipe native kitaplıkları yalnızca gerçek cihaz ABI'leri için (APK küçülsün; emülatör x86 desteklenmez).
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    // Stage 56/57: Shizuku UserService arayüzü (src/main/aidl/com/nexus/vr/IShellService.aidl) için.
    buildFeatures { aidl true }
    // El modeli sıkıştırılmadan paketlenmeli (MediaPipe asset'i doğrudan okur).
    androidResources { noCompress 'task', 'tflite' }
    buildTypes {
        release {
            minifyEnabled false
            // Yayın için kendi keystore'unuzla değiştirin; debug imzası yalnızca test içindir.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Stage 48 CI: bağımlılıklardan gelen çakışan META-INF dosyaları derlemeyi durdurmasın.
    packaging {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES', 'META-INF/AL2.0', 'META-INF/LGPL2.1', 'META-INF/*.kotlin_module', 'META-INF/versions/**']
        }
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Stage 44: native kamera (CameraX) + MediaPipe Tasks Vision (HandLandmarker, GPU delegate)
    def camerax = '1.3.4'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'
    // Stage 56: Shizuku ile Android uygulamalarını VR penceresindeki sanal ekranda açma
    def shizuku = '13.1.5'
    implementation "dev.rikka.shizuku:api:$shizuku"
    implementation "dev.rikka.shizuku:provider:$shizuku"
}

// Three.js must be bundled at build time. Do not silently create an APK that opens to a black screen.
def threeFile = file("src/main/assets/three.min.js")
tasks.register('fetchThree') {
    outputs.file(threeFile)
    onlyIf { !threeFile.exists() || threeFile.length() < 100000 }
    doLast {
        threeFile.parentFile.mkdirs()
        def urls = [
            'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
            'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',
            'https://raw.githubusercontent.com/mrdoob/three.js/r128/build/three.min.js'
        ]
        Exception lastError = null
        boolean downloaded = false
        urls.each { address ->
            if (!downloaded) {
                try {
                    def tmp = new File(threeFile.parentFile, 'three.min.js.download')
                    def conn = new URL(address).openConnection()
                    conn.connectTimeout = 15000
                    conn.readTimeout = 30000
                    conn.setRequestProperty('User-Agent', 'NEXUS-VR-build/1.0')
                    conn.inputStream.withCloseable { input -> tmp.withOutputStream { output -> output << input } }
                    if (tmp.length() < 100000) throw new GradleException("Three.js dosyası eksik indi: ${address}")
                    if (threeFile.exists()) threeFile.delete()
                    if (!tmp.renameTo(threeFile)) {
                        threeFile.bytes = tmp.bytes
                        tmp.delete()
                    }
                    downloaded = true
                    logger.lifecycle("Three.js yerel olarak eklendi: ${address}")
                } catch (Exception e) {
                    lastError = e
                    logger.warn("Three.js kaynağı başarısız: ${address} (${e.message})")
                }
            }
        }
        if (!downloaded && (!threeFile.exists() || threeFile.length() < 100000)) {
            throw new GradleException("Three.js indirilemedi. Siyah ekranlı APK oluşturulmasını önlemek için derleme durduruldu. İnternet bağlantısını kontrol edip tekrar derle.", lastError)
        }
    }
}
tasks.named('preBuild') { dependsOn 'fetchThree' }

// Stage 71: el modeli (hand_landmarker.task) artık APK'ya gömülmez; uygulama her açılışta internetten indirir (NativeCam.ensureModel).
