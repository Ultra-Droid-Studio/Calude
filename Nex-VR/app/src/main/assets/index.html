*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
/* Gaze pointer: one logical centre target; stereo mode renders one marker per eye viewport. */
#gaze-ui{position:fixed;inset:0;z-index:43;pointer-events:none;display:none}
.gaze-dot{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border:1.5px solid #fff;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.85),0 0 7px rgba(0,0,0,.7);background:rgba(25,211,197,.22)}
.gaze-dot:after{content:"";position:absolute;inset:2px;border-radius:50%;background:#19d3c5}
.gaze-ring{position:absolute;left:50%;top:50%;width:25px;height:25px;margin:-12.5px 0 0 -12.5px;border:2px solid transparent;border-top-color:#19d3c5;border-radius:50%;transform:rotate(0deg);opacity:0}
.gaze-dot.active .gaze-ring{opacity:1}
body.stereo #gaze-left{left:25%} body.stereo #gaze-right{left:75%}
body.pass #gaze-ui{display:block} body.gaze-active #gaze-ui{display:block}

#pass,#pass2{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;display:none;pointer-events:none;background:#000}
body.pass #pass{display:block}
html.npass,html.npass body{background:transparent!important}
html.npass #pass,html.npass #pass2{display:none!important}
body.pass.stereo #pass{width:50%}
body.pass.stereo #pass2{display:block;left:50%;width:50%}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:9px;backdrop-filter:blur(10px)}
button{font:inherit;color:var(--tx);background:rgba(47,123,255,.25);border:1px solid var(--line);border-radius:7px;padding:10px 14px;min-height:44px;cursor:pointer}
button:focus-visible{outline:2px solid var(--sec);outline-offset:2px}button:disabled{opacity:.45}
#load{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;background:radial-gradient(circle at 50% 30%,#14307a,var(--bg));text-align:center}
#load h1{font-size:clamp(34px,9vw,64px);letter-spacing:.12em;margin:0;font-weight:800}#load h1 span{color:var(--sec)}
#bar{width:min(360px,80vw);height:8px;border-radius:8px;background:#16213b;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pri),var(--sec));transition:width .3s}
#stat{width:min(440px,92vw);text-align:left;font-size:13px;color:var(--mu);padding:8px 12px}
#stat div{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px solid var(--line)}
.ok{color:var(--ok)}.no{color:var(--err)}.wn{color:var(--warn)}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);z-index:60;max-width:92vw;padding:10px 14px;display:none;text-align:center}
#err{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(5,9,20,.94)}
#err .glass{max-width:480px;padding:20px}
#hv{position:fixed;left:8px;bottom:8px;z-index:30;display:none;width:150px}
#hv video{width:100%;border-radius:10px;opacity:.85;display:block}
#hv button{width:100%;min-height:34px;padding:4px;margin-top:4px}
#hv #hswitch{background:rgba(25,211,197,.18);border-color:rgba(25,211,197,.5)}
/* Web content is rendered by native Android WebView overlays, not DOM iframes. */#hd{position:fixed;inset:0;width:100%;height:100%;z-index:46;pointer-events:none}#svd{position:fixed;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:#000;z-index:44;pointer-events:none;display:none}body.stereo #svd{display:block}body.stereo #hv{opacity:0;pointer-events:none}#hb{position:fixed;left:0;top:0;z-index:45;pointer-events:none;display:none;background:rgba(255,255,255,.04)}

#intro{position:fixed;inset:0;z-index:55;display:none;background:#050914;overflow:hidden}
#ishake{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:radial-gradient(circle at 50% 35%,#14307a,var(--bg));will-change:transform}
#idust{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#ititle{position:relative;margin:0;max-width:92vw;font-size:clamp(30px,8.5vw,68px);font-weight:800;letter-spacing:.04em;line-height:1.15}

.il{display:inline-block;opacity:0;transform:translateY(14px) scale(1.35);transition:opacity .18s,transform .22s cubic-bezier(.2,1.4,.4,1);text-shadow:0 0 18px rgba(47,123,255,.6)}

#istart{position:relative;margin-top:18px;padding:12px 34px;font-size:17px;font-weight:700;color:#fff;border:0;background:linear-gradient(90deg,var(--pri),var(--sec));opacity:0;pointer-events:none;transition:opacity .6s}

<script>
/* CanvasGradient guard for Android WebView: an invalid/missing color or offset
   must not abort the entire NEXUS VR scene initialization. */
(function(){
  try {
    if (!window.CanvasGradient || !CanvasGradient.prototype || CanvasGradient.prototype.__nxSafeStops) return;
    var proto = CanvasGradient.prototype;
    var original = proto.addColorStop;
    Object.defineProperty(proto, '__nxSafeStops', {value:true});
    proto.addColorStop = function(offset, color) {
      var n = Number(offset);
      if (!Number.isFinite(n)) n = 0;
      n = Math.max(0, Math.min(1, n));
      var c = (typeof color === 'string' && color.trim()) ? color : '#000000';
      try { return original.call(this, n, c); }
      catch (e) {
        try { return original.call(this, n, '#000000'); }
        catch (ignored) { return; }
      }
    };
  } catch (ignored) {}
})();
</script>

<script>

  };

  /* ---------- Stage 23: Pencere çubuğu (Quest/PhoneXR tarzı alt hap) ----------
     Her pencerenin altında yüzen koyu cam kapsül: başlık (tut-sürükle) + klavye, büyüt, küçült, kapat.
     Pencerenin çocuk mesh'idir; ışın seçme (Scene.targets) ve Input düğme/bekleme yolları aynen çalışır. */
  const Pill={
    CW:640,CH:96,
    ok(o){return !!o&&!!o.userData&&!o.userData.dead&&(WM.panels.includes(o)||!!o.userData.pillOf||!!o.userData.handMenu)},
    cw(u){return u.skin==='shz'?960:this.CW},
    want(m){const u=m.userData;return Settings.v.pill!==false&&(!!u.chrome||u.skin==='shz')&&!u.dock&&!u.kbd&&!u.fixedDesk&&!!u.cflat},
    sync(m){
      const u=m.userData;
      if(!this.want(m)){this.dispose(m);return}
      const gs=u.gs||1,pw=u.R*u.span*gs,ph=u.h*gs,cw=this.cw(u),wp=u.skin==='shz'?Math.min(pw,Math.max(pw*.7,u.R*.3)):Math.min(pw,Math.max(pw*.46,u.R*.2)),hp=wp*this.CH/cw;
      let pm=u.pill;
      if(!pm||u.pill.userData.dead){
        const cv=document.createElement('canvas');cv.width=cw;cv.height=this.CH;
        const tex=new THREE.CanvasTexture(cv);tex.wrapS=THREE.RepeatWrapping;tex.repeat.x=-1;tex.generateMipmaps=false;tex.minFilter=THREE.LinearFilter;
        pm=new THREE.Mesh(new THREE.BufferGeometry(),new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide,depthWrite:false}));
        pm.userData={panel:true,pillOf:m,btns:[],hov:-1,cv,tex,R:u.R,id:(u.id||'win')+':pill',chrome:false,key:'',dead:false};
        pm.castShadow=false;pm.renderOrder=3;
        m.add(pm);u.pill=pm
      }
      pm.userData.R=u.R;
      pm.geometry.dispose();
      const g=new THREE.PlaneGeometry(wp,hp),uv=g.attributes.uv;
      for(let i=0;i<uv.count;i++)uv.setX(i,1-uv.getX(i));
      uv.needsUpdate=true;pm.geometry=g;
      pm.position.set(0,-ph/2-hp*.7,-u.R+curveZ(u,0)+.02);
      pm.userData.key='';
      this.paint(pm,true)
    },
    dispose(m){
      const u=m.userData,pm=u.pill;
      if(!pm)return;
      pm.userData.dead=true;
      m.remove(pm);pm.geometry.dispose();pm.userData.tex.dispose();pm.material.dispose();
      u.pill=null
    },
    kbd(m){
      const u=m.userData;
      if(XR.session){Diag.toast('VR içinde metin girişi yok','var(--warn)');return}
      if(u.id==='browser'){BR.ask();return}
      if(typeof u.kbdFn==='function'){u.kbdFn();return}
      Diag.toast('Bu pencerede yazı alanı yok','var(--warn)',2200)
    },
    paint(pm,force){
      const pu=pm.userData;
      if(pu.dead)return;
      const m=pu.pillOf,u=m.userData,c=pu.cv.getContext('2d'),W=pu.cv.width,H=pu.cv.height;
      const foc=WM.focused===m,dw=(Input.dw&&Input.dw.o===pm)?Input.dw:null;
      const shz=u.skin==='shz',port=shz&&!!(u.web&&SHZ.isPort(u.web.pkg));
      const key=[u.title,foc,u.max,pu.hov,dw?dw.i+':'+Math.round(dw.p*24):'',Settings.v.acc,port].join('|');
      if(!force&&key===pu.key)return;
      pu.key=key;
      c.clearRect(0,0,W,H);
      c.save();c.shadowColor='rgba(0,0,0,.28)';c.shadowBlur=12;c.shadowOffsetY=3;
      rr(c,6,5,W-12,H-14,(H-14)/2);
      c.fillStyle='rgba(34,36,41,.86)';c.fill();c.restore();
      rr(c,6,5,W-12,H-14,(H-14)/2);
      c.lineWidth=1.2;c.strokeStyle=foc?'rgba(255,255,255,.18)':'rgba(255,255,255,.08)';c.stroke();
      /* Taşıma çubuğu: pilin tamamı sürüklenebilir, bu küçük tutamaç bunu görünür kılar */
      c.fillStyle='rgba(255,255,255,.3)';rr(c,W/2-26,11,52,5,2.5);c.fill();
      pu.btns=[];
      const r=27,cy=H/2-2,sp=r*2+10,items=[];
      /* Stage 71: Android (Shizuku) pencerelerinde pile Dik/Yatay + yukarı/aşağı kaydır düğmeleri (basılı tutunca tekrarlar) */
      if(shz){
        const up=()=>BF.scrollId(BF.webId(u),-1),dn=()=>BF.scrollId(BF.webId(u),1);
        up.rep=true;dn.rep=true;
        items.push(['rot',port?'Yatay moda geç':'Dik moda geç',()=>SHZ.rotate(m)],['chevup','Yukarı kaydır',up],['chevdown','Aşağı kaydır',dn])
      }
      items.push(['kbd','Klavye',()=>this.kbd(m)],['expand','Büyüt veya eski boyuta döndür',()=>WM.toggleMax(m)],['min','Küçült',()=>WM.minimize(m,true)],['close','Kapat',()=>WM.close(m)]);
      const x0=W-24-r-(items.length-1)*sp;
      items.forEach((it,k)=>{
        const cx=x0+k*sp,i=pu.btns.length;
        pu.btns.push({x:cx-r,y:cy-r,w:r*2,h:r*2,fn:it[2],n:it[1]});
        const hv=i===pu.hov,on=it[0]==='expand'&&u.max;
        c.beginPath();c.arc(cx,cy,r,0,6.3);
        c.fillStyle=hv?(it[0]==='close'?'rgba(238,76,88,.94)':'rgba(255,255,255,.2)'):on?'rgba(255,255,255,.14)':'rgba(255,255,255,.05)';
        c.fill();
        if(it[0]==='kbd'){
          c.save();c.lineWidth=2.4;c.strokeStyle='#f3f7f8';c.fillStyle='#f3f7f8';
          rr(c,cx-14,cy-9,28,18,4);c.stroke();

        }else if(it[0]==='rot'){
          /* Dik/Yatay: geçilecek yönün dikdörtgeni + dönme oku */
          c.save();c.lineWidth=2.4;c.lineJoin='round';c.lineCap='round';c.strokeStyle='#f3f7f8';
          if(port)rr(c,cx-11,cy-7,22,14,3);else rr(c,cx-7,cy-11,14,22,3);
          c.stroke();
          c.beginPath();c.arc(cx,cy,19,-2.5,-0.9);c.stroke();
          const ax=cx+19*Math.cos(-0.9),ay=cy+19*Math.sin(-0.9);
          c.beginPath();c.moveTo(ax-8,ay-1);c.lineTo(ax,ay);c.lineTo(ax-1,ay+8);c.stroke();
          c.restore()
        }else ICN(c,it[0],cx,cy,12,'#f3f7f8');
        if(dw&&dw.i===i&&dw.p>0){
          c.save();c.lineWidth=4;c.lineCap='round';c.strokeStyle='#19d3c5';
          c.beginPath();c.arc(cx,cy,r+3,-Math.PI/2,-Math.PI/2+dw.p*Math.PI*2);c.stroke();c.restore()
        }
      });
      c.textAlign='left';c.font='600 29px system-ui,sans-serif';
      c.fillStyle=foc?'#f1f2f4':'rgba(205,210,218,.55)';
      let t=String(u.title||'');const mw=x0-r-34-26;
      while(t.length>1&&c.measureText(t).width>mw)t=t.slice(0,-1);
      if(t!==String(u.title||''))t=t.slice(0,-1)+'…';
      c.fillText(t,34,cy+10);
      pu.tex.needsUpdate=true;Scene.dirty=true
    }
  };

  /* ---------- Stage 23: El menüsü (avuç yüze dönükken elin üstünde açılır) ----------
     PhoneXR HandMenu mantığı: avuç yüze dönük + açık el ~0,6 sn → elin üstünde cam çubuk. Öbür elin işaret parmağı
     ile bekleme/çimdik seçer. Menü 3B bir paneldir (kameraya bakar); Scene.targets ile seçilebilir. */
  const HMenu={
    m:null,open:false,hand:-1,hold:0,seen:0,x:.5,y:.3,rc:null,v2:null,tv:null,
    CW:720,CH:470,
    items:[
      ['dots9','Kitaplık',()=>Launcher.toggle()],
      ['globe','Tarayıcı',()=>WM.spawn('browser')],
      ['film','Sinema',()=>WM.spawn('cinema')],
      ['gear','Ayarlar',()=>WM.spawn('settings')],
      ['reset','Hizala',()=>{Cam.reset();Scene.dirty=true;Diag.toast('Görünüm hizalandı','var(--ok)',1500)}],
      ['min','Küçült',()=>{WM.panels.filter(p=>p.visible&&p.userData.chrome&&!p.userData.dock&&!p.userData.kbd&&!p.userData.fixedDesk).forEach(p=>WM.minimize(p,true))}]
    ],
    holds(s){return this.open&&this.hand===s.id},
    ensure(){
      if(this.m)return;
      const cv=document.createElement('canvas');cv.width=this.CW;cv.height=this.CH;
      const tex=new THREE.CanvasTexture(cv);tex.wrapS=THREE.RepeatWrapping;tex.repeat.x=-1;tex.generateMipmaps=false;tex.minFilter=THREE.LinearFilter;
      const w=.44,g=new THREE.PlaneGeometry(w,w*this.CH/this.CW),uv=g.attributes.uv;
      for(let i=0;i<uv.count;i++)uv.setX(i,1-uv.getX(i));
      uv.needsUpdate=true;
      const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide,depthTest:false}));
      m.renderOrder=60;m.visible=false;m.castShadow=false;m.frustumCulled=false;
      m.userData={panel:true,handMenu:true,btns:[],hov:-1,cv,tex,R:.8,id:'handmenu',chrome:false};
      Scene.scene.add(m);this.m=m;
      this.rc=new THREE.Raycaster();this.v2=new THREE.Vector2();this.tv=new THREE.Vector3()
    },
    facing(s){
      const r=s.raw,d=(a,b)=>Math.hypot(r[a].x-r[b].x,r[a].y-r[b].y);
      const ax=r[5].x-r[0].x,ay=r[5].y-r[0].y,bx=r[17].x-r[0].x,by=r[17].y-r[0].y,cross=ax*by-ay*bx,palm=Math.max(.02,d(5,17));
      const back=Settings.v.hcam!=='user',lab=String(s.label||'').toLowerCase();
      const physLeft=back?lab==='right':lab==='left';
      let pf=physLeft?cross<0:cross>0;
      if(!back)pf=!pf;
      if(Settings.v.hmflip)pf=!pf;
      return pf&&Math.abs(cross)>palm*palm*.15
    },
    openHand(s){
      const r=s.raw,d=(a,b)=>Math.hypot(r[a].x-r[b].x,r[a].y-r[b].y);
      return [[8,6],[12,10],[16,14],[20,18]].every(p=>d(0,p[0])>d(0,p[1])*1.12)
    },
    scan(S,now){
      if(Settings.v.hmenu===false||XR.session){if(this.open)this.close();return}
      let best=null;
      for(const s of S){
        if(!s.on||!s.d||!s.raw||s.raw.length<21||s.pr||s.mode!=='')continue;
        if(this.openHand(s)&&this.facing(s)){best=s;break}
      }
      if(!best){this.hold=0;return}
      this.seen=now;
      const r=best.raw,px=(r[0].x+r[5].x+r[9].x+r[17].x)/4,py=(r[0].y+r[5].y+r[9].y+r[17].y)/4,palm=Math.hypot(r[5].x-r[17].x,r[5].y-r[17].y);
      const sx=Hand.mirror?1-px:px,tx=clamp(sx,.18,.82),ty=clamp(py-palm*2.2-.12,.14,.84);
      if(!this.open){
        if(!this.hold)this.hold=now;
        else if(now-this.hold>600){this.hand=best.id;this.x=tx;this.y=ty;this.show()}
      }else if(this.hand===best.id){
        this.x+=(tx-this.x)*.35;this.y+=(ty-this.y)*.35
      }
    },
    show(){
      this.ensure();
      this.open=true;this.m.visible=true;this.m.userData.hov=-1;
      this.place();this.paint()
    },
    close(){
      this.hold=0;
      if(!this.open)return;
      this.open=false;
      if(this.m){this.m.visible=false;this.m.userData.hov=-1}
      Input.dwDone=null;Input.dwellClear(true);
      Scene.dirty=true
    },
    place(){
      if(!this.m)return;
      this.rc.setFromCamera(this.v2.set(this.x*2-1,-(this.y*2-1)),Cam.cam);
      const ray=this.rc.ray;
      this.m.position.copy(ray.origin).addScaledVector(ray.direction,.8);
      Cam.cam.getWorldPosition(this.tv);
      this.m.lookAt(this.tv);
      this.m.updateMatrixWorld(true);
      Scene.dirty=true
    },
    tick(){
      if(!this.open)return;
      if(performance.now()-this.seen>1500){this.close();return}
      this.place()
    },
    paint(){
      if(!this.m)return;
      const u=this.m.userData,c=u.cv.getContext('2d'),W=u.cv.width,H=u.cv.height,acc=ACC[Settings.v.acc];
      c.clearRect(0,0,W,H);
      c.save();c.shadowColor='rgba(0,0,0,.5)';c.shadowBlur=26;
      rr(c,16,16,W-32,H-32,90);
      const g=c.createLinearGradient(0,16,0,H-16);g.addColorStop(0,'rgba(43,48,56,.94)');g.addColorStop(1,'rgba(26,30,36,.95)');
      c.fillStyle=g;c.fill();c.restore();
      rr(c,16,16,W-32,H-32,90);c.lineWidth=2;c.strokeStyle='rgba(255,255,255,.2)';c.stroke();
      u.btns=[];
      const COLS=3,PAD=40,tw=(W-2*PAD)/COLS,th=(H-2*PAD)/2,dw=(Input.dw&&Input.dw.o===this.m)?Input.dw:null;
      this.items.forEach((it,i)=>{
        const x=PAD+(i%COLS)*tw+8,y=PAD+Math.floor(i/COLS)*th+8,w=tw-16,h=th-16,hv=i===u.hov;
        u.btns.push({x,y,w,h,fn:()=>{this.close();it[2]()},n:it[1]});
        rr(c,x,y,w,h,34);c.fillStyle=hv?acc:'rgba(255,255,255,.09)';c.fill();
        if(hv){rr(c,x-4,y-4,w+8,h+8,38);c.lineWidth=5;c.strokeStyle='#fff';c.stroke()}
        ICN(c,it[0],x+w/2,y+h*.36,28,'#fff');
        c.fillStyle='#fff';c.textAlign='center';c.font='600 25px system-ui,sans-serif';
        c.fillText(it[1],x+w/2,y+h-24);c.textAlign='left';
        if(dw&&dw.i===i&&dw.p>0){
          c.save();c.lineWidth=6;c.lineCap='round';c.strokeStyle='#19d3c5';
          c.beginPath();c.arc(x+w/2,y+h*.36,40,-Math.PI/2,-Math.PI/2+dw.p*Math.PI*2);c.stroke();c.restore()
        }
      });
      u.tex.needsUpdate=true;Scene.dirty=true
    }
  };
  /* ---------- Pencere yöneticisi (kavisli 360° paneller) ---------- */
  const WM={
    panels:[],
    focused:null,
    names:['Ön yay','360° halka','Yüzen','Minimal'],
    create(def){
      const customR=!!(def&&def.R!==undefined);
      const u=Object.assign({panel:true,sf:1,ang:0,y:1.9,R:2.9,btns:[],hov:-1,chrome:true,live:false,max:false,saved:null,tab:0},def);
      // Normal app windows use flat planes arranged around the user; dock/keyboard keep their own geometry.
      if(u.cflat===undefined)u.cflat=!u.kbd; // Dock and ordinary windows use flat planes; keyboard keeps its own geometry.
      u.base={span:u.span,h:u.h};
      /* Stage 68: Ayarlar → Grafik → Pencere/Dok uzaklığı (metre). Yalnızca kendi R'sini özel
         olarak belirtmeyen sıradan pencereler (tarayıcı, ayarlar, web/Android uygulama pencereleri…)
         ve dock bundan etkilenir; klavye, sinema ekranı, el menüsü gibi özel yerleşimler dokunulmaz. */
      if(u.dock)u.R=Settings.v.ddist||u.R;
      else if(!customR&&!u.kbd&&!u.fixedDesk){u.distAdj=true;u.R=Settings.v.wdist||u.R}
      const m=new THREE.Mesh(new THREE.BufferGeometry(),new THREE.MeshBasicMaterial({side:THREE.BackSide,transparent:true}));
      m.userData=u;
      m.castShadow=false;
      u.cv=document.createElement('canvas');
      u.tex=new THREE.CanvasTexture(u.cv);
      u.tex.wrapS=THREE.RepeatWrapping;
      u.tex.repeat.x=-1;
      u.tex.generateMipmaps=false;
      u.tex.minFilter=THREE.LinearFilter;
      m.material.map=u.tex;
      if(u.flat)m.material.side=THREE.DoubleSide;
      const stackOff=(!u.dock&&!u.kbd&&!u.fixedDesk)?this.panels.length*.004:0;
      u.R+=stackOff;
      if(u.distAdj)u.distOff=stackOff;
      Scene.scene.add(m);
      this.panels.push(m);
      this.build(m);
      return m
    },
    /* Stage 68: uzaklık ayarı değişince açık pencerelere/dock'a uygula (yeniden açmaya gerek yok). */
    applyDist(){
      const wd=clamp(+Settings.v.wdist||2.9,1.2,5),dd=clamp(+Settings.v.ddist||1.8,.8,3.2);
      Settings.v.wdist=wd;Settings.v.ddist=dd;
      this.panels.forEach(m=>{
        const u=m.userData;
        if(u.dock){u.R=dd;this.build(m)}
        else if(u.distAdj){u.R=wd+(u.distOff||0);this.build(m)}
      });
      Scene.dirty=true
    },
    build(m){
      const u=m.userData,fx=u.dock||u.kbd,ps=fx?1:clamp(Settings.v.pscale||1,.7,1.3);
      u.span=u.base.span*u.sf*ps*(fx?1:1.08);

      // selector, cinema screen, launcher) deliberately use different aspect ratios;
      // forcing every panel into one rectangle breaks their layouts.
      u.h=u.base.h*u.sf*ps*(fx?1:1.08*u.R/3.2);
      if(u.fixedDesk){u.sf=1;u.span=u.fixedW/u.R;u.h=u.fixedH}
      m.geometry.dispose();
      if(u.flat){
        /* Yatay klavye: kullanıcının hemen önünde, zemine paralel düz bir levha. uv.x ters çevrilir (tuş eşlemesi için). */
        const fw=u.fw||1.3,fh=fw*400/1024,g=new THREE.PlaneGeometry(fw,fh),uv=g.attributes.uv;
        for(let i=0;i<uv.count;i++)uv.setX(i,1-uv.getX(i));
        uv.needsUpdate=true;m.geometry=g;
        u.cv.width=1024;u.cv.height=400
      }else{
      if(u.cflat){const gs=u.gs||1,pw=u.R*u.span*gs,ph=u.h*gs,cv=u.curve===undefined?(!u.dock&&!u.kbd):u.curve,pg=new THREE.PlaneGeometry(pw,ph,cv?Math.max(8,Math.ceil(pw*8)):1,1),uv=pg.attributes.uv;for(let i=0;i<uv.count;i++)uv.setX(i,1-uv.getX(i));u.curved=!!cv;if(cv){const pp=pg.attributes.position;for(let i=0;i<pp.count;i++)pp.setZ(i,curveZ(u,pp.getX(i)))}if(u.tilt)pg.rotateX(-u.tilt);pg.translate(0,0,-u.R);m.geometry=pg;m.material.side=THREE.DoubleSide}else m.geometry=new THREE.CylinderGeometry(u.R,u.R,u.h,Math.max(8,Math.ceil(u.span*18)),1,true,Math.PI-u.span/2,u.span);
      u.cv.width=u.dock?Math.round(1024*u.span/1.3):(u.cvW||1024);
      u.cv.height=Math.round(u.cv.width*u.h/(u.R*u.span))
      }
      if(u.liveImg){u.liveImg=null;u.tex.image=u.cv}
      u.tex.dispose();
      Pill.sync(m);
      this.place(m);
      this.paint(m)
    },
    place(m){
      const u=m.userData;
      if(u.fixedDesk){u.ang=0;u.y=u.deskY}
      if(u.flat){
        m.rotation.order='YXZ';
        m.rotation.set(-Math.PI/2,u.ang,0);
        m.position.set(u.fx||0,u.y,u.fz||0)
      }else{
        m.rotation.y=u.ang;
        m.position.set(u.fx||0,u.y,u.fz||0)
      }
      Scene.dirty=true
    },
    paint(m){
      if(m.userData.pillOf){Pill.paint(m,true);return}
      if(m.userData.handMenu){HMenu.paint();return}
      /* Canlı doku (Win7): görüntü doğrudan WebView anlık görüntüsünden gelir; tuvali yeniden çizip yüklemeyiz. */
      if(m.userData.liveImg&&m.userData.fixedDesk){if(m.userData.pill)Pill.paint(m.userData.pill);Scene.dirty=true;return}
      const u=m.userData,c=u.cv.getContext('2d'),W=u.cv.width,H=u.cv.height,acc=ACC[Settings.v.acc],a=Settings.v.alpha,foc=m===this.focused;
      c.clearRect(0,0,W,H);
      if(u.dock)dockBg(c,W,H,a,foc);
      else if(u.skin!=='qs'&&u.skin!=='shz'){
        const sk=u.skin||'win',rad=u.fixedDesk?0:(sk==='kb'?30:sk==='lib'?64:28);
        rr(c,2,2,W-4,H-4,rad);
        if(sk==='lib'){c.fillStyle='rgba(0,0,0,0)'}

    tgt(m){
      const dk=this.panels.find(p=>p.userData.dock);
      if(!dk)return null;
      const d=dk.userData,u=m.userData,pos=DK[u.id]||DK.lib||[d.cv.width/2,d.cv.height/2,d.cv.height*.3];
      const W=d.cv.width,H=d.cv.height,th=Math.PI-d.span/2+(1-pos[0]/W)*d.span,v=new THREE.Vector3(d.R*Math.sin(th),((1-pos[1]/H)-.5)*d.h,d.R*Math.cos(th));
      dk.updateMatrixWorld(true);

      m.updateMatrixWorld(true);
      m.worldToLocal(v);
      let a=Math.atan2(v.x,v.z);
      a+=2*Math.PI*Math.round((Math.PI-a)/(2*Math.PI));

    genie(m,dir){

      // Skip the cylinder-based genie deformation for flat panels; normal visibility,
      // focus, positioning, rotation, touch, drag and hand-tracking remain unchanged.
      if(u.cflat)return false;

      m.geometry=new THREE.CylinderGeometry(u.R,u.R,u.h,Math.max(8,Math.ceil(u.span*18)),28,true,Math.PI-u.span/2,u.span);

      return true
    },
    deform(m,p){
      const u=m.userData,pos=m.geometry.attributes.position,b=u.base0,T=u.tg,h=u.h,q=clamp((p-.12)/.88,0,1),dl=.6,PI=Math.PI;
      for(let i=0;i<pos.count;i++){
        const x=b[i*3],y=b[i*3+1],z=b[i*3+2];
        let th=Math.atan2(x,z);
        if(th<=0)th+=2*PI;
        const R=Math.hypot(x,z),v=(y+h/2)/h,e=clamp(q*(1+dl)-v*dl,0,1),ee=e*e*(3-2*e);
        const ws=1-(1-T.ws)*ee,tn=PI+(th-PI)*ws+(T.th-PI)*ee,Rn=R+(T.R-R)*ee,yn=y+(T.y-y)*ee;
        pos.setXYZ(i,Rn*Math.sin(tn),yn,Rn*Math.cos(tn))

    },
    tick(now){

        if(bad||t>=1){

      if(id==='cinema'){Cinema.toggle();return}
      if(id==='saber'){Game.toggle();return}
      if(id==='planets'){Planets.toggle();return}
      if(id==='gorilla'){if(window.Gorilla)Gorilla.toggle();else Diag.toast('Goril oyunu yüklenemedi','var(--err)');return}
      if(typeof id==='string'&&id.startsWith('and:')){AND.launch(id.slice(4));return}
      let m=this.panels.find(p=>p.userData.id===id);
      if(m){
        if(id==='win7simu'&&m.visible&&!m.userData.min&&!(m.userData.anim&&m.userData.anim.dir>0)){this.close(m);return}
        const wasMin=!m.visible&&!!m.userData.min,u=m.userData;
        if(u.anim&&u.anim.dir>0){
          u.anim=null;
          u.base0=null;
          m.frustumCulled=true;
          this.build(m)
        }
        m.visible=true;
        u.min=false;
        if(u.id==='win7simu')W7Desk.show();
        this.focus(m);
        this.paint(m);
        if(wasMin&&!u.dock&&!Settings.v.reduce&&!XR.session)this.genie(m,-1);
        if(!m.userData.dock)AppState.save();
        return
      }
      const d=id.startsWith('app:')?WebApps.def(id):id.startsWith('shz:')?SHZ.def(id):APPS[id]();
      if(!d)return;
      m=this.create(d);
      if(m.userData.id==='win7simu')W7Desk.show();

      if(id==='saber')return Game.on;
      if(id==='planets')return Planets.on;
      if(id==='gorilla')return !!(window.Gorilla&&Gorilla.on);
      if(typeof id==='string'&&id.startsWith('and:'))return false;

    layout(i,quiet){

      const L=this.panels.filter(p=>p.visible&&!p.userData.dock&&!p.userData.kbd&&!p.userData.fixedDesk),n=L.length;
      L.forEach((m,k)=>{
        const u=m.userData;
        u.y=1.9;
        u.sf=i===3?.7:u.max?1.6:(i===0?.72:1);
        if(i===0)u.ang=0;
        else if(i===1)u.ang=k*6.2832/n;
        else if(i===2){
          u.ang=(k-(n-1)/2)*1.4;
          u.y=1.9+((k%3)-1)*.45

          u.ang=(k-(n-1)/2)*.81;

        const gap=.04,hw=L.map(m=>Math.atan(m.userData.span/2)),tot=hw.reduce((s,h)=>s+2*h,0)+gap*Math.max(0,n-1);

          a0+=2*hw[k]+gap;
          u.y=clamp(.5+u.h/2,1.05,2.4);
          this.place(m)
        })
      }
      if(!quiet)Diag.toast('Düzen: '+this.names[i]);
      this.repaintAll()
    }

    norm(raw){
      raw=(raw||'').trim();
      if(!raw)return null;
      if(/^[a-z][a-z0-9+.-]*:/i.test(raw)&&!/^https?:/i.test(raw))return{err:'Güvenlik nedeniyle yalnızca http/https kabul edilir.'};
      const safe=h=>{
        try{
          const u=new URL(h);
          if(u.protocol==='http:'){u.protocol='https:';if(u.port==='80')u.port=''}
          const n=u.hostname.toLowerCase();
          if(u.username||u.password)return{err:'Kullanıcı adı/şifre içeren adresler engellendi.'};
          if(n==='appassets.androidplatform.net'||n==='localhost'||n.endsWith('.localhost')||n.endsWith('.local')||n.endsWith('.internal')||n==='[::1]'||/^\[(fc|fd|fe80)/i.test(n)||/^(0|10|127)\.|^169\.254\.|^192\.168\.|^172\.(1[6-9]|2\d|3[01])\.|^100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\./.test(n))return{err:'Yerel ve özel ağ adresleri güvenlik nedeniyle engellendi.'};

        }catch(e){

        }

  /* One Euro filtresi (Casiez ve ark.): durgunken titreme yok, hızlı harekette gecikme yok.
     k: değeri "el boyu" birimine çeviren çarpan (1/el boyu). Hız el boyuna göre ölçülür; böylece el kameraya
     yakın da olsa uzak da olsa aynı ayar aynı davranır. (Eski sürümde beta, 0-1 aralığındaki koordinatlara göre
     çok küçüktü: süzgeç hızlı harekete hiç uyum sağlamıyor, sabit ~90 ms gecikme veriyordu.)

      if(!Number.isFinite(t))return this.x;

      if(dt>.25){this.x=v;this.t=t;this.dx=0;return v}

      }
      const bt=q('#lbat');
      if(this.bat){
        const p=Math.round(this.bat.level*100);
        bt.style.display='';q('#lbt').textContent='%'+p;
        const i=q('#lbi');i.style.width=Math.max(8,p)+'%';i.style.background=p<=20&&!this.bat.charging?'#ff4d5e':'#3ddc84'
      }else bt.style.display='none';
      q('#lwf').classList.toggle('off',navigator.onLine===false);
      const ok=!!XR.ok;
      q('#lvt').textContent=ok?'VR Cihazı Hazır':'VR Cihazı Bağlı Değil';
      q('#lvs').textContent=ok?'Başlat’a basarak VR’a geç.':'Lütfen VR cihazınızı takın.'
    },
    /* ---- el takibi → sahne ---- */
    setHov(b){
      if(this.hov===b)return;
      if(this.hov)this.hov.classList.remove('hv');
      this.hov=b;
      if(b)b.classList.add('hv')
    },
    press(b){
      b.classList.add('pz');
      setTimeout(()=>b.classList.remove('pz'),160);
      b.click()
    },
    hands(S){
      const W=innerWidth,H=innerHeight;let any=null;
      for(const s of S){
        const i=s.id;
        if(!s.on||!s.d){this.prev[i]=false;continue}
        const x=s.dsx*W,y=s.dsy*H,t=document.elementFromPoint(x,y),b=t&&t.closest?t.closest('#lobby [data-a]'):null;
        if(b&&(!any||s.pr))any=b;
        if(s.pr&&!this.prev[i]&&b&&performance.now()-this.ck>380){this.ck=performance.now();this.press(b)}
        this.prev[i]=s.pr
      }
      this.setHov(any)
    },
    loop(){
      if(!this.open){this.raf=0;return}
      this.raf=requestAnimationFrame(()=>this.loop());
      const t=performance.now();
      if(Hand.on){try{Hand.tick(t)}catch(e){}}
      if(t-this.lt<160)return;
      this.lt=t;
      const S=Hand.slots||[],live=Hand.on&&S.some(s=>s.on&&s.d);
      if(!live){this.setHov(null);this.prev[0]=this.prev[1]=false}
      const hs=this.el.querySelector('#lhs');
      if(hs){
        const pin=Hand.on&&S.some(s=>s.on&&s.pr),has=Hand.on&&S.some(s=>s.on);
        hs.className='tst'+(pin?' pinch':has?' hand':'');
        hs.lastChild.textContent=!Hand.on?'Çimdik testi: önce el takibini aç':pin?'Çimdik algılandı':has?'El algılandı — parmaklarını birleştir':'El aranıyor…'
      }
      const hr=this.el.querySelector('#lhandrow');
      if(hr&&!this.busy){const sw=hr.querySelector('.sw');if(sw&&sw.classList.contains('on')!==!!Hand.on){sw.classList.toggle('on',!!Hand.on);sw.setAttribute('aria-checked',Hand.on?'true':'false')}}
    },
    show(go){
      if(!this.built)this.build();
      this.go=go;this.open=true;this.page='home';this.exitAt=0;this.pi=-1;
      const ld=$('#load');if(ld)ld.style.display='none';
      this.el.classList.add('on');
      this.theme();this.fit();this.render();this.status();
      this._rs=this._rs||(()=>this.fit());
      addEventListener('resize',this._rs);
      if(!this.raf)this.loop();
      try{Diag.say('Nex VR başlatıcı. Başlat düğmesine basarak VR masaüstünü aç.')}catch(e){}
    },
    hide(){
      this.open=false;
      if(this.el)this.el.classList.remove('on');
      removeEventListener('resize',this._rs||(()=>{}));
      cancelAnimationFrame(this.raf);this.raf=0;
      this.setHov(null);this.prev[0]=this.prev[1]=false
    }
  };
  /* LOBBY:END */
  const App={
    entered:false,
    last:0,
    lastT:0,
    lq:[0,0,0,0,0],
    async boot(){
      const bar=$('#bar i'),st=$('#stage'),box=$('#stat');
      const row=(k,val,cls)=>{
        const d=document.createElement('div');
        d.innerHTML='<span></span><b class="'+cls+'"></b>';
        d.children[0].textContent=k;
        d.children[1].textContent=val;
        box.appendChild(d)
      };
      const step=(t,p)=>{
        st.textContent=t;
        bar.style.width=p+'%'
      };
      document.documentElement.classList.toggle('rm',!!Settings.v.reduce);
      step('Arayüz hazırlanıyor…',10);
      row('Çalıştırma',location.protocol==='file:'?'file:// — kamera kısıtlı':isSecureContext?'güvenli bağlam':'güvenli değil (kamera çalışmaz)',location.protocol==='file:'||!isSecureContext?'wn':'ok');
      step('three.js yükleniyor…',30);
      const ok=await loadThree();
      if(!ok){
        row('three.js','yüklenemedi','no');
        Diag.fail('three.js yüklenemedi','CDN\'e ulaşılamadı.','İnternet bağlantını kontrol et. Çevrimdışı kullanım için three.min.js (r128) dosyasını index.html ile aynı klasöre koy.');
        return
      }
      step('WebGL kontrol ediliyor…',50);
      Cam.init();
      if(!Renderer.init()){
        row('WebGL','kullanılamıyor','no');
        Diag.fail('WebGL kullanılamıyor','Tarayıcı WebGL bağlamı oluşturamadı.','Donanım hızlandırmayı açın veya başka bir tarayıcı deneyin.');
        return
      }
      row('WebGL','çalışıyor','ok');
      step('3D sahne hazırlanıyor…',65);
      Scene.init();
      Input.init();
      let wp=null;
      try{
        wp=localStorage.getItem('nexus.wp')
      }catch(e){}
      if(Settings.v.wp===-1&&wp)Scene.loadWP(wp,false);
      else Scene.setWP(Math.max(0,Settings.v.wp));
      step('Sensör desteği kontrol ediliyor…',78);
      row('Sensör API',window.DeviceOrientationEvent?'var (izin gerekebilir)':'yok',window.DeviceOrientationEvent?'ok':'wn');
      row('Kamera API',navigator.mediaDevices&&navigator.mediaDevices.getUserMedia?'var (el takibi isteğe bağlı)':'yok',navigator.mediaDevices?'ok':'wn');
      step('VR modu hazırlanıyor…',90);
      XR.ok=false;XR.support='Stereo/Cardboard modu';
      row('VR modu','Stereo (Cardboard) — WebXR kullanılmıyor','ok');
      step('Sistem hazır',100);
      const b=$('#start');
      const go=()=>{try{this.enter()}catch(e){console.error('NEXUS VR açılış hatası',e);Diag.fail('VR başlatılamadı',String(e&&e.message||e)+' @ '+String((e&&e.stack||'').split('\n').slice(1,4).map(x=>x.trim().replace(/^at /,'').slice(-90)).join(' | ')),'Uygulamayı yeniden başlat. Sorun sürerse Tanı ekranındaki hatayı paylaş.')}};
      try{
        Lobby.show(go) /* açılış: başlatıcı sahnesi (Başlat → VR masaüstü) */
      }catch(e){
        console.error('Başlatıcı sahnesi açılamadı, eski açılışa dönüldü',e);
        const ld=$('#load');if(ld)ld.style.display='flex';
        b.disabled=false;
        b.onclick=()=>Intro.run(go);
        b.focus()
      }
    },
    enter(){
      this.entered=true;
      $('#load').style.display='none';
      WebApps.init();
      if(Settings.v.pass)Pass.enable();
      if(Settings.v.awake)Sys.awake(true);
      document.addEventListener('fullscreenchange',()=>{
        if(!document.fullscreenElement&&Stereo.on&&Stereo.fs)Stereo.stop();
        WM.repaintAll()
      });
      WM.create({id:'dock',title:'',icon:'globe',dock:true,chrome:false,span:1.3,h:.36,R:1.8,y:.85,ang:0,gs:.55,tilt:.38,live:true,render:dockRender});Pins.fit();
      const saved=AppState.load();
      if(saved&&saved.length){
        saved.forEach(s=>{
          if(!s||!s.id)return;
          if(s.id.startsWith('app:')){
            if(!WebApps.list.find(a=>a.id===s.id.slice(4)))return
          }else if(!APPS[s.id])return;
          WM.spawn(s.id);
          const m=WM.panels.find(p=>p.userData.id===s.id);
          if(m){
            if(s.max&&!m.userData.max)WM.toggleMax(m);
            if(s.min)WM.minimize(m)
          }
        })
      }else if(saved===null){
        ['browser','settings','help'].forEach(id=>WM.spawn(id))
      }
      WM.layout(Settings.v.layout,true);
      Settings.apply();
      WM.focus(WM.panels[1]||WM.panels[0]||null);
      $('#hstop').onclick=()=>Hand.stop();
      $('#hswitch').onclick=()=>{
        Settings.v.hcam=Settings.v.hcam==='user'?'environment':'user';
        Settings.save();
        $('#hswitch').textContent=Settings.v.hcam==='user'?'Arka kameraya geç':'Ön kameraya geç';
        if(Hand.on)Hand.restart();
        else Diag.toast((Settings.v.hcam==='user'?'Ön':'Arka')+' kamera seçildi; el takibini açınca kullanılır');
      };
      $('#hswitch').textContent=Settings.v.hcam==='user'?'Arka kameraya geç':'Ön kameraya geç';
      let _resizeQueued=false;
      const _safeResize=()=>{if(_resizeQueued)return;_resizeQueued=true;requestAnimationFrame(()=>{_resizeQueued=false;Renderer.resize()})};
      addEventListener('resize',_safeResize,{passive:true});
      addEventListener('orientationchange',()=>setTimeout(_safeResize,250),{passive:true});
      if(window.visualViewport)window.visualViewport.addEventListener('resize',_safeResize,{passive:true});
      document.addEventListener('visibilitychange',()=>{
        Scene.dirty=true;
        if(!document.hidden&&Settings.v.awake&&!Sys.wl)Sys.awake(true);
        if(!document.hidden)Pass.check();
        Renderer.r.setAnimationLoop(document.hidden&&!XR.session?null:t=>this.frame(t))
        });
      addEventListener('pagehide',()=>{
        AppState.save();
        XR.session&&XR.session.end();
        Cam.gyro&&Cam.disableGyro();
        Hand.on&&Hand.stop();
        Pass.suspend();
        Renderer.r.setAnimationLoop(null)
        });
      // Android WebView bazen ilk çizimi sonraki kareye bırakabiliyor; sahneyi zorla yenile.
      Renderer.resize();
      Scene.dirty=true;
      try{Renderer.r.render(Scene.scene,Cam.cam)}catch(renderError){console.error('İlk VR çizimi başarısız',renderError)}
      Renderer.r.setAnimationLoop(t=>this.frame(t));
      setInterval(()=>{
        if(document.hidden)return;
        if(!XR.session)BF.update();
        WM.panels.forEach(p=>p.visible&&p.userData.live&&(XR.session||inV(p))&&WM.paint(p))
      },300)
    },
    cap(){
      const v=Settings.v;
      let c=v.fpscap||0;
      if(v.saver)c=c?Math.min(c,30):30;
      return c
    },
    frame(t){
      if(Renderer.lost)return;
      const cp=XR.session?0:this.cap();
      if(cp&&t-this.lastT<1000/cp-3){Hand.tick(t);return}
      this.lastT=t;
      const dt=Math.min(.1,(t-this.last)/1000||.016);
      this.last=t;
      Perf.tick();
      Input.tick(dt);
      Hand.tick(t);
      HMenu.tick();
      Cinema.tick();
      Game.tick();
      Planets.tick();
      if(window.Gorilla)Gorilla.tick(dt);
      W7Desk.sync();
      Cam.update(dt);
      WM.tick(performance.now());
      if(WM.need){
        WM.need=false;
        WM.panels.forEach(p=>p.visible&&WM.paint(p))
      }
      const q=Cam.cam.quaternion,z=Cam.cam.position.z,L=this.lq,ch=q.x!==L[0]||q.y!==L[1]||q.z!==L[2]||q.w!==L[3]||z!==L[4];
      if(ch){
        L[0]=q.x;
        L[1]=q.y;
        L[2]=q.z;
        L[3]=q.w;
        L[4]=z
      }
      if(!(XR.session||ch||Scene.dirty))return;
      Scene.dirty=false;
      BF.update();
      if(Stereo.on&&!XR.session)Stereo.render(Renderer.r,Scene.scene,Cam.cam);
      else Renderer.r.render(Scene.scene,Cam.cam)
    }
  };
  window.NEXUS={App,Scene,Renderer,Cam,XR,Stereo,Input,WM,BR,Hand,Settings,Storage,Perf,Diag,Game,Planets,Cinema,Launcher};
  App.boot().catch(e=>Diag.fail('Başlatma hatası','Beklenmeyen bir hata oluştu.','Sayfayı yenile. ('+(e&&e.name)+')'));
  })();
</script>
