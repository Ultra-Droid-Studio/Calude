apply plugin: 'com.android.application'

android {
    namespace 'com.ultradroid.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.ultradroid.app"
        minSdk 24
        targetSdk 34
        versionCode 83
        versionName "1.9.65"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // index.html çok büyük (gömülü ikonlar/görseller içeriyor);
    // apk içinde sıkıştırılmadan paketlensin ki WebView hızlı açsın.
    androidResources {
        noCompress 'html', 'js', 'css'
    }

    buildFeatures {
        buildConfig false
        aidl true
    }
}

dependencies {
    // Shizuku: shell yetkisiyle sanal ekran (virtual display) açmak için
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    // Dosya Gezgini: dosyaları başka uygulamada açmak için FileProvider
    implementation 'androidx.core:core:1.12.0'
    // Google girişi: X-Requested-With başlığını kaldırma + Sec-CH-UA (Chrome gibi görünme)
    implementation 'androidx.webkit:webkit:1.11.0'
}
