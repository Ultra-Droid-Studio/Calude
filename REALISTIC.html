<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Büyük Şehir 3D</title>
<style>
:root{--bg:#0b1020;--fg:#eaf0ff}
@media (prefers-color-scheme: dark){:root{--bg:#0b1020;--fg:#eaf0ff}}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:system-ui,sans-serif;color:var(--fg)}
canvas{display:block;touch-action:none}
#ui{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
#ui button{pointer-events:auto;background:rgba(10,16,32,.7);color:var(--fg);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:8px 12px;font-size:14px;backdrop-filter:blur(6px)}
#hint{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);left:0;right:0;text-align:center;font-size:12px;opacity:.75;pointer-events:none}
#joy{position:fixed;left:calc(env(safe-area-inset-left,0px) + 24px);bottom:calc(env(safe-area-inset-bottom,0px) + 56px);width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);touch-action:none;backdrop-filter:blur(4px)}
#joy:before{content:'';position:absolute;inset:34%;border-radius:50%;border:1px dashed rgba(255,255,255,.25)}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 2px 8px rgba(0,0,0,.4);pointer-events:none}
#act{position:fixed;right:calc(env(safe-area-inset-right,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 56px);display:flex;flex-direction:column;align-items:flex-end;gap:12px}
#act .r{display:flex;gap:12px}
.ab{width:66px;height:66px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.4);color:#fff;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;backdrop-filter:blur(4px)}
.ab{font-size:13px;letter-spacing:.3px}
#bFly{width:96px;height:96px;font-size:18px}
.ab.on{background:rgba(120,190,255,.55);border-color:#fff}
#menu{position:fixed;inset:0;z-index:20;pointer-events:none}
#mcol{position:absolute;left:calc(env(safe-area-inset-left,0px) + 5%);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:22px;align-items:flex-start}
.mb{pointer-events:auto;background:none;border:0;color:#fff;font:700 clamp(18px,3.4vw,30px) system-ui,sans-serif;letter-spacing:1px;text-shadow:0 2px 10px rgba(0,0,0,.85);padding:6px 4px;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:left}
.mb:active{opacity:.6}
#mSet{position:absolute;left:calc(env(safe-area-inset-left,0px) + 5%);bottom:calc(env(safe-area-inset-bottom,0px) + 6%)}
#rAct{position:fixed;right:calc(env(safe-area-inset-right,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 56px);display:none;opacity:0;transform:scale(.85);transition:opacity .25s,transform .25s;pointer-events:none}body.room #rAct{display:flex}body.room #rAct.show{opacity:1;transform:none;pointer-events:auto}body.room #ui,body.room #act{display:none!important}#rFade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .5s;z-index:50}
body.menu #ui,body.menu #joy,body.menu #act,body.menu #hint{display:none!important}
</style></head><body class="menu">
<div id="menu"><div id="mcol"><button class="mb" id="mAbout">Hakkında</button><button class="mb" id="mCont">Var olan oyuna devam et</button><button class="mb" id="mNew">Yeni oyun</button></div><button class="mb" id="mSet">Ayarlar</button></div>
<div id="ui"><button id="bt">☀️/🌙 Gündüz-Gece</button><button id="br">🔄 Otomatik dönüş</button></div>
<div id="joy"><div id="knob"></div></div>
<div id="act"><div class="r"><div class="ab" id="bWeb">YAPIŞ</div><div class="ab" id="bDn">İN / BIRAK</div></div><div class="ab" id="bFly">UÇ</div></div>
<div id="hint">Sürükle: döndür · İki parmak/tekerlek: yakınlaştır</div>
<div id="rAct"><div class="ab" id="rOut" style="width:100px;height:100px;font-size:13px;text-align:center">DIŞARI ÇIK</div></div><div id="rFade"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const R=(a,b)=>a+Math.random()*(b-a);let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const rr=(a,b)=>a+rnd()*(b-a);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.5,1500);
const ren=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
let pq=Math.min(devicePixelRatio,1.5);ren.setPixelRatio(pq);ren.setSize(innerWidth,innerHeight);
ren.shadowMap.enabled=true;ren.shadowMap.type=THREE.PCFShadowMap;
document.body.appendChild(ren.domElement);

// lights
const hemi=new THREE.HemisphereLight(0xbfd8ff,0x445533,.7);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff0d0,1.1);sun.position.set(180,260,120);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);const sc=sun.shadow.camera;sc.left=-260;sc.right=260;sc.top=260;sc.bottom=-260;sc.far=700;scene.add(sun);

// ground
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1600,1600),new THREE.MeshLambertMaterial({color:0x4f7a3f}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

// window texture
function winTex(lit,cols,rows){const c=document.createElement('canvas');c.width=64*cols/2;c.height=64*rows/2;const g=c.getContext('2d');
g.fillStyle='#2a3445';g.fillRect(0,0,c.width,c.height);
const w=c.width/cols,h=c.height/rows;
for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){const on=lit&&Math.random()<.55;
g.fillStyle=on?(Math.random()<.8?'#ffd77a':'#9fd8ff'):(lit?'#1a2230':'#7fa6c9');
g.fillRect(i*w+w*.18,j*h+h*.2,w*.64,h*.6);}
const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;return t}
const dayTex=[],nightTex=[];
for(let k=0;k<4;k++){dayTex.push(winTex(false,6,12));nightTex.push(winTex(true,6,12));}
function glassTex(lit){const c=document.createElement('canvas');c.width=128;c.height=256;const g=c.getContext('2d');
for(let i=0;i<8;i++)for(let j=0;j<16;j++){g.fillStyle=lit?(Math.random()<.5?'#ffe3a0':'#16233a'):'hsl(205,'+(35+Math.random()*25)+'%,'+(48+Math.random()*28)+'%)';g.fillRect(i*16,j*16,16,16)}
g.strokeStyle=lit?'#0a0f1a':'#e9eff6';g.lineWidth=2;for(let i=0;i<=8;i++){g.beginPath();g.moveTo(i*16,0);g.lineTo(i*16,256);g.stroke()}for(let j=0;j<=16;j++){g.beginPath();g.moveTo(0,j*16);g.lineTo(128,j*16);g.stroke()}
const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;return t}
function brickTex(lit){const c=document.createElement('canvas');c.width=96;c.height=192;const g=c.getContext('2d');g.fillStyle=lit?'#2b1f1c':'#c98a72';g.fillRect(0,0,96,192);
if(!lit){g.strokeStyle='rgba(60,25,15,.35)';for(let y=0;y<192;y+=6){g.beginPath();g.moveTo(0,y);g.lineTo(96,y);g.stroke();for(let x=(y/6%2)*6;x<96;x+=12){g.beginPath();g.moveTo(x,y);g.lineTo(x,y+6);g.stroke()}}}
for(let i=0;i<3;i++)for(let j=0;j<6;j++){const x=i*32+6,y=j*32+6;g.fillStyle=lit?'#3a2c28':'#f2efe8';g.fillRect(x-2,y-2,24,24);g.fillStyle=lit?(Math.random()<.6?'#ffd77a':'#1a2230'):'#6f93b3';g.fillRect(x,y,20,20);g.fillStyle=lit?'#3a2c28':'#f2efe8';g.fillRect(x+9,y,2,20);g.fillRect(x,y+9,20,2)}
const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;return t}
dayTex.push(glassTex(false),brickTex(false));nightTex.push(glassTex(true),brickTex(true));
const wallCols=[0xd9cbb5,0xb7bcc4,0xc9a88b,0x9aa7b5,0xe3ddd0,0x8d99a8,0xb98f7c,0xcfd6dc];
const mats=[];
function bMat(col,h,w,d,k){
const m=new THREE.MeshLambertMaterial({color:col,map:dayTex[k]});
m.userData.k=k;mats.push(m);return m}
function buildingMats(col,w,h,d,k){
const rep=(t,x,y)=>{const c=t.clone();c.needsUpdate=true;c.repeat.set(x,y);return c};
const fx=Math.max(1,Math.round(w/4)),fz=Math.max(1,Math.round(d/4)),fy=Math.max(2,2*Math.round(h/8));
const mk=(rx)=>{const key=col+'|'+k+'|'+rx+'|'+fy;if(matCache[key])return matCache[key];const m=new THREE.MeshLambertMaterial({color:col,map:rep(dayTex[k],rx,fy)});m.userData={k,rx,fy};mats.push(m);return matCache[key]=m};
const roof=roofShared;
return [mk(fz),mk(fz),roof,roof,mk(fx),mk(fx)]}

const city=new THREE.Group();scene.add(city);
const matCache={},roofShared=new THREE.MeshLambertMaterial({color:0x555a60}),parks={};
const boxes=[],bGroups=[];
function add(m){m.castShadow=m.receiveShadow=true;city.add(m);return m}

// roads layout
const BLK=44,ROAD=14,N=9; // 9x9 blocks
const half=N*(BLK+ROAD)/2;
const roadMat=new THREE.MeshLambertMaterial({color:0x2b2e33});
const walkMat=new THREE.MeshLambertMaterial({color:0x9a9a96});
const lineMat=new THREE.MeshBasicMaterial({color:0xf2e6a0});
const zebraMat=new THREE.MeshBasicMaterial({color:0xeeeeee});
const roadBase=new THREE.Mesh(new THREE.PlaneGeometry(N*(BLK+ROAD)+ROAD,N*(BLK+ROAD)+ROAD),roadMat);
roadBase.rotation.x=-Math.PI/2;roadBase.position.y=.05;roadBase.receiveShadow=true;scene.add(roadBase);
const cx=i=>-half+ROAD/2+BLK/2+i*(BLK+ROAD)+ROAD/2-ROAD/2+ (ROAD/2);
const bc=i=>-half+ROAD+BLK/2+i*(BLK+ROAD)-ROAD/2+ROAD/2-ROAD/2;
function center(i){return -half+ROAD+BLK/2+i*(BLK+ROAD)}
// lane lines
for(let i=0;i<=N;i++){const p=-half+ROAD/2+i*(BLK+ROAD);
for(let s=-half+4;s<half-2;s+=8){
const a=new THREE.Mesh(new THREE.PlaneGeometry(.4,3.5),lineMat);a.rotation.x=-Math.PI/2;a.position.set(p,.09,s);scene.add(a);
const b=new THREE.Mesh(new THREE.PlaneGeometry(3.5,.4),lineMat);b.rotation.x=-Math.PI/2;b.position.set(s,.09,p);scene.add(b);}}

const treeTrunk=new THREE.CylinderGeometry(.25,.35,2.2,6),leafG=new THREE.IcosahedronGeometry(1.8,1),pineG=new THREE.ConeGeometry(1.7,4,7);
const trunkM=new THREE.MeshLambertMaterial({color:0x6b4a2e});
const leafMs=[0x2f7d3a,0x3d9447,0x56a64d,0x2a6b34].map(c=>new THREE.MeshLambertMaterial({color:c}));
function tree(x,z,s=1){const g=new THREE.Group();
const t=new THREE.Mesh(treeTrunk,trunkM);t.position.y=1.1;g.add(t);
if(rnd()<.35){const l=new THREE.Mesh(pineG,leafMs[3]);l.position.y=4;g.add(l);const l2=l.clone();l2.scale.set(.7,.7,.7);l2.position.y=5.6;g.add(l2)}
else{const l=new THREE.Mesh(leafG,leafMs[(rnd()*3)|0]);l.position.y=3.6;l.scale.y=.9;g.add(l);const l2=l.clone();l2.scale.set(.6,.6,.6);l2.position.set(.8,4.6,.3);g.add(l2)}
g.position.set(x,0,z);g.scale.setScalar(s);g.traverse(o=>{if(o.isMesh){o.castShadow=true}});city.add(g)}

// people (static)
const skin=[0xf1c9a5,0xd9a47c,0x9c6b4a,0x6b4630];
const clothes=[0xc0392b,0x2e86c1,0x27ae60,0xf1c40f,0x8e44ad,0x2c3e50,0xe67e22,0xecf0f1];
const pBody=new THREE.CylinderGeometry(.28,.32,1,8),pHead=new THREE.SphereGeometry(.24,10,8),pLeg=new THREE.BoxGeometry(.2,.8,.22);
function person(x,z){const g=new THREE.Group();
const lm=new THREE.MeshLambertMaterial({color:0x2c3a55});
const l1=new THREE.Mesh(pLeg,lm);l1.position.set(-.13,.4,0);const l2=l1.clone();l2.position.x=.13;
const b=new THREE.Mesh(pBody,new THREE.MeshLambertMaterial({color:clothes[(rnd()*8)|0]}));b.position.y=1.3;
const h=new THREE.Mesh(pHead,new THREE.MeshLambertMaterial({color:skin[(rnd()*4)|0]}));h.position.y=2.0;
const hair=new THREE.Mesh(new THREE.SphereGeometry(.25,8,6,0,6.3,0,1.4),new THREE.MeshLambertMaterial({color:[0x222,0x4a2c12,0xc9a14a,0x777][(rnd()*4)|0]}));hair.position.y=2.03;
g.add(l1,l2,b,h,hair);g.position.set(x,.1,z);g.rotation.y=rnd()*6.28;g.scale.setScalar(.95);
g.traverse(o=>{if(o.isMesh)o.castShadow=true});city.add(g)}

// lamps
const lampPole=new THREE.CylinderGeometry(.08,.1,5,6),lampHead=new THREE.SphereGeometry(.28,8,6);
const lampMat=new THREE.MeshBasicMaterial({color:0x666666});const lamps=[];
const poleM=new THREE.MeshLambertMaterial({color:0x333840});
function lamp(x,z){const p=new THREE.Mesh(lampPole,poleM);p.position.set(x,2.5,z);city.add(p);
const h=new THREE.Mesh(lampHead,lampMat);h.position.set(x,5.1,z);city.add(h)}

// car
const carCols=[0xd63031,0x0984e3,0xfdcb6e,0xdfe6e9,0x2d3436,0x00b894];
function car(x,z,rot){const g=new THREE.Group();
const m=new THREE.MeshLambertMaterial({color:carCols[(rnd()*6)|0]});
const b=new THREE.Mesh(new THREE.BoxGeometry(2,.7,4.2),m);b.position.y=.7;
const c=new THREE.Mesh(new THREE.BoxGeometry(1.7,.6,2.1),new THREE.MeshLambertMaterial({color:0x9fc6e6}));c.position.set(0,1.3,-.2);
g.add(b,c);
const wm=new THREE.MeshLambertMaterial({color:0x111111});
[[-1,1.3],[1,1.3],[-1,-1.3],[1,-1.3]].forEach(([a,d])=>{const w=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,.3,10),wm);w.rotation.z=Math.PI/2;w.position.set(a,.38,d);g.add(w)});
g.position.set(x,0,z);g.rotation.y=rot;g.traverse(o=>{if(o.isMesh)o.castShadow=true});city.add(g)}

// buildings
const downtown=(i,j)=>Math.hypot(i-(N-1)/2,j-(N-1)/2);
const L=c=>new THREE.MeshLambertMaterial({color:c});
const stoneM=L(0xcfc9bd),darkM=L(0x1d242c),metalM=L(0xa4adb8),goldM=L(0xd8b04a),copperM=L(0x5fb09f),roofG=L(0x44525f),solarM=L(0x1c3f7a);
const awnCols=[0xc0392b,0x2471a3,0x1e8449,0xd68910,0x7d3c98],pastel=[0xd98e73,0x7fa3c7,0xe3c26b,0x93b88a,0xc27a8f,0xb5a28a];
const B=(g,w,h,d,m,x,y,z)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;g.add(o);return o};
const CY=(g,r1,r2,h,m,x,y,z,s=12)=>{const o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,s),m);o.position.set(x,y,z);o.castShadow=true;g.add(o);return o};
function texMat(col,k,rx,fy){const m=new THREE.MeshLambertMaterial({color:col,map:dayTex[k]});m.userData={k,rx,fy};mats.push(m);return m}
function prism(rad,len,m){const p=new THREE.Mesh(new THREE.CylinderGeometry(rad,rad,len,3),m);p.rotation.x=-Math.PI/2;p.castShadow=true;return p}
function beacon(g,y,s=.5){const b=new THREE.Mesh(new THREE.SphereGeometry(s,8,6),new THREE.MeshBasicMaterial({color:0xff2222}));b.position.y=y;g.add(b);blinkers.push(b)}
function place(g,x,z){g.position.set(x,0,z);city.add(g);bGroups.push(g)}
function frame(g,w,h,d){B(g,w+.6,1.2,d+.6,stoneM,0,.6,0);B(g,w+.8,.7,d+.8,stoneM,0,h,0);for(const sx of[-1,1])for(const sz of[-1,1])B(g,.8,h,.8,stoneM,sx*w/2,h/2,sz*d/2)}
function storefront(g,w,d){B(g,w*.84,3.4,.3,darkM,0,2.2,d/2+.1);const a=B(g,w*.84,.25,2,L(awnCols[(rnd()*5)|0]),0,4.1,d/2+1);a.rotation.x=.25;B(g,w*.4,.8,.2,goldM,0,5,d/2+.2)}
function glassTower(x,z,w,d,h){const g=new THREE.Group();const rx=Math.max(1,Math.round(w/20)),fy=Math.max(1,Math.round(h/40));const m=texMat(0xffffff,4,rx,fy);
B(g,w,9,d,[L(0x8a949e),L(0x8a949e),roofG,roofG,m,m],0,4.5,0);B(g,w+.6,.6,d+.6,stoneM,0,9.3,0);storefront(g,w,d);
const w2=w*.78,d2=d*.78;B(g,w2,h,d2,[m,m,roofG,roofG,m,m],0,9+h/2,0);
for(let y=25;y<h;y+=25)B(g,w2+.5,.6,d2+.5,metalM,0,9+y,0);
for(const sx of[-1,1])for(const sz of[-1,1])B(g,.6,h,.6,metalM,sx*w2/2,9+h/2,sz*d2/2);
const cr=new THREE.Mesh(new THREE.ConeGeometry(Math.max(w2,d2)*.68,h*.12,4),m);cr.rotation.y=Math.PI/4;cr.position.y=9+h+h*.06;g.add(cr);
CY(g,.15,.3,h*.2,metalM,0,9+h+h*.2,0,6);beacon(g,9+h+h*.3);place(g,x,z)}
function artDeco(x,z,w,d,h){const g=new THREE.Group();let y=0,cw=w,cd=d;const k=(rnd()*4)|0;
for(const f of[.4,.26,.18,.1]){const th=h*f;B(g,cw,th,cd,buildingMats(0xe6dcc6,cw,th,cd,k),0,y+th/2,0);
for(let n=0;n<6;n++){const px=-cw/2+(n+.5)*cw/6;B(g,.5,th,.6,stoneM,px,y+th/2,cd/2+.25);B(g,.5,th,.6,stoneM,px,y+th/2,-cd/2-.25)}
B(g,cw+.8,.7,cd+.8,goldM,0,y+th+.35,0);y+=th+.7;cw*=.78;cd*=.78}
const sp=new THREE.Mesh(new THREE.ConeGeometry(cw*.5,h*.28,8),goldM);sp.position.y=y+h*.14;g.add(sp);beacon(g,y+h*.29);storefront(g,w,d);place(g,x,z)}
function cylTower(x,z,r,h){const g=new THREE.Group();const m=texMat(0xffffff,4,Math.max(2,Math.round(r*.3)),Math.max(1,Math.round(h/40)));
CY(g,r*1.3,r*1.3,6,stoneM,0,3,0,28);CY(g,r*1.32,r*1.32,.8,darkM,0,2.2,0,28);const t=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,28),m);t.position.y=6+h/2;t.castShadow=true;g.add(t);
for(let y=20;y<h;y+=20)CY(g,r+.4,r+.4,.6,metalM,0,6+y,0,28);
CY(g,r*.6,r*.6,5,metalM,0,6+h+2.5,0,20);const hp=CY(g,r*.85,r*.85,.4,L(0x333a40),0,6+h+.2,0,24);
const rg=new THREE.Mesh(new THREE.TorusGeometry(r*.6,.25,6,24),new THREE.MeshBasicMaterial({color:0xffd23f}));rg.rotation.x=Math.PI/2;rg.position.y=6+h+.5;g.add(rg);
CY(g,.15,.3,h*.15,metalM,0,6+h+5+h*.07,0,6);beacon(g,6+h+5+h*.15);place(g,x,z)}
function apartment(x,z,w,d,h){const g=new THREE.Group();const m=texMat(pastel[(rnd()*6)|0]===0?0xffffff:[0xffffff,0xf3d9c8,0xd9e6f2,0xe8e0b8][(rnd()*4)|0],5,Math.max(1,Math.round(w/9)),Math.max(1,Math.round(h/21)));
B(g,w,h,d,[m,m,L(0x3c4046),L(0x3c4046),m,m],0,h/2,0);const n=Math.floor(h/3.5),u=Math.max(1,Math.round(w/9));
